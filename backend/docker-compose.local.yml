# 로컬 개발용 MySQL. 배포와는 무관하며, 로컬 머신에서만 사용한다.
# 실행: docker compose -f docker-compose.local.yml up -d
# .env.local의 DATABASE_URL과 아래 설정이 일치해야 한다.
services:
  mysql:
    image: mysql:9.7
    container_name: planlog-mysql-local
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: planlog
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - planlog_mysql_data:/var/lib/mysql

volumes:
  planlog_mysql_data:
